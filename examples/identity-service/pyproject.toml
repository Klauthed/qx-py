[project]
name = "identity-service"
version = "0.1.0"
description = "Reference Qx service: full CQRS + outbox + worker example."
requires-python = ">=3.14"
dependencies = [
    "qx-core",
    "qx-di",
    "qx-cqrs",
    "qx-db",
    "qx-cache",
    "qx-events",
    "qx-http",
    "qx-observability",
    "qx-worker",
    "qx-auth",
    "qx-flags",
    "qx-regions",
    "uvicorn[standard]>=0.32.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "qx-testing",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
