[project]
name = "rental-service"
version = "0.1.0"
description = "Reference Qx service: vertical-slice architecture with user, house, and rent slices."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "qx-core",
    "qx-di",
    "qx-cqrs",
    "qx-db",
    "qx-events",
    "qx-http",
    "qx-observability",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "qx-testing",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rental_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
