[project]
name = "qx-projections"
version = "1.1.0"
description = "Qx projection runner: rebuild and incrementally update read models from the event log"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-db",
    "qx-eventstore",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
