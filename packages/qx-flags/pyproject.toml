[project]
name = "qx-flags"
version = "1.1.0"
description = "Qx feature flags: thin OpenFeature wrapper for flag-gated pipeline behaviors"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "openfeature-sdk>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
