[project]
name = "qx-cli"
version = "0.2.0"
description = "Qx CLI: scaffolding, code generation, local dev orchestration"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
qx = "qx.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
