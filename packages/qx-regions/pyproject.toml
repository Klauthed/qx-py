[project]
name = "qx-regions"
version = "1.0.0"
description = "Qx multi-region: tenant home-region resolution, write routing, and cross-region event replication"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-db",
    "qx-events",
    "sqlalchemy[asyncio]>=2.0.30",
    "pydantic-settings>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
