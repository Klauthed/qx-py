[project]
name = "qx-cqrs"
version = "0.1.0"
description = "Qx CQRS / Mediator: commands, queries, events, pipeline behaviors"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-di",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
