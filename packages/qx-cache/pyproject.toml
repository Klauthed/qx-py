[project]
name = "qx-cache"
version = "0.1.0"
description = "Qx cache layer: Redis client, idempotency store, distributed locks"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-di",
    "redis[hiredis]>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
