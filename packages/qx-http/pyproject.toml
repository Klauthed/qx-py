[project]
name = "qx-http"
version = "0.1.0"
description = "Qx HTTP layer: FastAPI integration, container-aware Depends, Result-to-HTTP mapping, middleware"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-di",
    "qx-cqrs",
    "qx-observability",
    "fastapi>=0.115.0",
    "starlette>=0.41.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
