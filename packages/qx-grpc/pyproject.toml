[project]
name = "qx-grpc"
version = "1.1.0"
description = "Qx gRPC: server factory, context-propagation interceptors, Result-to-status mapping"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-di",
    "qx-cqrs",
    "qx-observability",
    "grpcio>=1.66.0",
    "grpcio-status>=1.66.0",
    "protobuf>=5.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
