[project]
name = "qx-worker"
version = "0.1.0"
description = "Qx worker runtime: NATS consumer with retry/DLQ/tracing"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "qx-core",
    "qx-di",
    "qx-cqrs",
    "qx-events",
    "qx-observability",
    "nats-py>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qx"]
