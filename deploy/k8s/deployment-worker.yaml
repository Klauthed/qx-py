apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${SERVICE_NAME}-worker
  labels:
    app.kubernetes.io/name: ${SERVICE_NAME}
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ${SERVICE_NAME}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ${SERVICE_NAME}
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ${IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "${SERVICE_PACKAGE}.worker"]
          envFrom:
            - configMapRef: { name: ${SERVICE_NAME}-config }
            - secretRef: { name: ${SERVICE_NAME}-secrets }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
