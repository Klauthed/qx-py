{{- if .Values.outboxRelay.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qx.fullname" . }}-outbox-relay
  labels:
    {{- include "qx.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "qx.name" . }}
      app.kubernetes.io/component: outbox-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "qx.name" . }}
        app.kubernetes.io/component: outbox-relay
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: outbox-relay
          image: {{ include "qx.image" . }}
          command: ["python", "-m", "{{ .Values.service.packageName }}.outbox_relay"]
          envFrom:
            - configMapRef:
                name: {{ include "qx.fullname" . }}-config
            {{- if .Values.externalSecrets.enabled }}
            - secretRef:
                name: {{ include "qx.fullname" . }}-secrets
            {{- end }}
          resources:
            {{- toYaml .Values.outboxRelay.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      terminationGracePeriodSeconds: 30
{{- end }}
