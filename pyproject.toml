[project]
name = "qx-python-workspace"
version = "0.1.0"
description = "Qx Python backend framework ecosystem"
requires-python = ">=3.14"
license = { text = "Proprietary" }
authors = [{ name = "Qx Engineering" }]
dependencies = [
    "identity-service",
    "qx-core",
    "qx-di",
    "qx-cqrs",
    "qx-db",
    "qx-cache",
    "qx-events",
    "qx-observability",
    "qx-http",
    "qx-worker",
    "qx-grpc",
    "qx-auth",
    "qx-search",
    "qx-cli",
    "qx-testing",
    "qx-devtools",
]


[tool.uv.workspace]
members = [
    "examples/identity-service","packages/*"]

[tool.uv.sources]
identity-service = { workspace = true }
qx-core = { workspace = true }
qx-di = { workspace = true }
qx-cqrs = { workspace = true }
qx-db = { workspace = true }
qx-cache = { workspace = true }
qx-events = { workspace = true }
qx-observability = { workspace = true }
qx-http = { workspace = true }
qx-worker = { workspace = true }
qx-grpc = { workspace = true }
qx-auth = { workspace = true }
qx-search = { workspace = true }
qx-cli = { workspace = true }
qx-testing = { workspace = true }
qx-devtools = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "testcontainers>=4.8.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/**", "**/_generated/**"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "B",                # bugbear
    "UP",               # pyupgrade
    "N",                # pep8-naming
    "SIM",              # simplify
    "RUF",              # ruff-specific
    "ASYNC",            # async correctness
    "PL",               # pylint subset
    "TID",              # tidy imports
    "TCH",              # type-checking imports
]
ignore = [
    "E501",             # line too long (handled by formatter)
    "PLR0913",          # too many args (DI constructors)
    "PLR2004",          # magic value (pragmatic)
    "N818",             # error suffix on exception classes (we use *Error)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "S101", "TID252"]
"**/templates/**" = ["F", "E", "W"]  # Jinja templates with syntax markers

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_reexport = false
explicit_package_bases = true
mypy_path = [
    "packages/qx-core/src",
    "packages/qx-di/src",
    "packages/qx-cqrs/src",
    "packages/qx-db/src",
    "packages/qx-cache/src",
    "packages/qx-events/src",
    "packages/qx-http/src",
    "packages/qx-worker/src",
    "packages/qx-observability/src",
    "packages/qx-auth/src",
    "packages/qx-grpc/src",
    "packages/qx-search/src",
    "packages/qx-testing/src",
    "packages/qx-cli/src",
    "packages/qx-devtools/src",
    "examples/identity-service/src",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["grpc", "grpc.aio", "grpc.*", "google.protobuf", "google.protobuf.*", "google.rpc", "google.rpc.*", "grpc_status", "grpc_status.*", "testcontainers", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests", "tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: integration tests requiring external services",
    "slow: tests that take > 1s",
]
