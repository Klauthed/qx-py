name: Release

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    # Gate this job on the "pypi" environment so the PYPI_TOKEN secret is
    # scoped and the release can require manual approval if configured.
    environment: pypi

    permissions:
      contents: write  # create GitHub release and upload artifacts
      id-token: write  # required for PyPI Trusted Publishers (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: Pre-publish checks
        run: ./scripts/check.sh

      - name: Build packages
        run: ./scripts/build.sh --clean

      # Upload each package individually with --skip-existing so that:
      #   - Partial runs (e.g. hit by PyPI's new-project rate limit) are safely retried
      #   - Already-published packages are skipped on re-runs
      # FIRST-TIME ONLY: set PYPI_API_TOKEN (account-wide) in the "pypi" environment.
      # After all projects are registered, delete the secret — OIDC takes over.
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          set -eo pipefail

          uploaded=0
          skipped=0
          failed=()
          
          # Group artifacts by package base name
          mapfile -t packages < <(
            find dist -name "*.whl" \
              | sed 's/-[0-9].*//' \
              | xargs -n1 basename \
              | sort -u
          )

          for pkg in "${packages[@]}"; do
            echo ""
            echo "========================================="
            echo "Publishing package: $pkg"
            echo "========================================="

            artifacts=(dist/${pkg}-*)

            success=0

            for attempt in 1 2 3 4 5; do
              echo "Attempt $attempt..."

              if uvx twine upload \
                --skip-existing \
                "${artifacts[@]}"; then

                success=1
                ((uploaded++)) || true
                break
              fi

              sleep_time=$((attempt * 30))

              echo "Upload failed. Sleeping ${sleep_time}s..."
              sleep "$sleep_time"
            done

            if [[ $success -eq 0 ]]; then
              failed+=("$pkg")
            fi

            # Important: avoid PyPI throttling
            sleep 15
          done

          echo ""
          echo "========================================="
          echo "Upload Summary"
          echo "========================================="
          echo "Uploaded packages: $uploaded"

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "Failed packages:"
            printf ' - %s\n' "${failed[@]}"
            exit 1
          fi


      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --title "$TAG" \
            --generate-notes
