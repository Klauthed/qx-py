name: Release

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    # Gate this job on the "pypi" environment so the PYPI_TOKEN secret is
    # scoped and the release can require manual approval if configured.
    environment: pypi

    permissions:
      contents: write  # create GitHub release and upload artifacts
      id-token: write  # required for PyPI Trusted Publishers (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: Pre-publish checks
        run: ./scripts/check.sh

      - name: Build packages
        run: ./scripts/build.sh --clean

      # Trusted Publisher registered at https://pypi.org/manage/account/publishing/
      # owner=klauthed  repo=qx-py  workflow=release.yml  environment=pypi
      # FIRST-TIME ONLY: set PYPI_API_TOKEN (account-wide) in the "pypi" environment.
      # After all projects are registered on PyPI, delete the secret — OIDC takes over.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}


      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --title "$TAG" \
            --generate-notes
