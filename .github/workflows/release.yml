name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)."
        required: false

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: Pre-publish checks
        run: ./scripts/check.sh

      - name: Build packages
        run: ./scripts/build.sh --clean

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "value=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  build-vscode:
    name: Build VS Code extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install and compile
        working-directory: extensions/vscode
        run: npm ci && npm run compile

      - name: Package .vsix
        working-directory: extensions/vscode
        run: npx vsce package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-ext
          path: extensions/vscode/*.vsix
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Never block the GitHub release if PyPI is unavailable (rate-limited, outage, etc.)
    continue-on-error: true

    environment: pypi

    permissions:
      id-token: write  # OIDC Trusted Publisher

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      # Trusted Publisher registered at https://pypi.org/manage/account/publishing/
      # owner=klauthed  repo=qx-py  workflow=release.yml  environment=pypi
      # FIRST-TIME ONLY: set PYPI_API_TOKEN (account-wide) in the "pypi" environment.
      # After all projects are registered on PyPI, delete the secret — OIDC takes over.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  create-release:
    name: Create GitHub release
    needs: [build, build-vscode]
    runs-on: ubuntu-latest
    # Runs regardless of PyPI outcome.
    if: always() && needs.build.result == 'success' && needs.build-vscode.result == 'success'

    permissions:
      contents: write

    steps:
      - name: Download Python build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Download VS Code extension
        uses: actions/download-artifact@v8
        with:
          name: vscode-ext
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            || gh release upload "$TAG" dist/*.whl dist/*.tar.gz dist/*.vsix \
                 --repo "$GITHUB_REPOSITORY" \
                 --clobber
