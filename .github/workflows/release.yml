name: Release

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    # Gate this job on the "pypi" environment so the PYPI_TOKEN secret is
    # scoped and the release can require manual approval if configured.
    environment: pypi

    permissions:
      contents: write  # create GitHub release and upload artifacts
      id-token: write  # required for PyPI Trusted Publishers (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: Pre-publish checks
        run: ./scripts/check.sh

      - name: Build packages
        run: ./scripts/build.sh --clean

      # Stage to TestPyPI first. Trusted Publisher must be registered at
      # https://test.pypi.org/manage/account/publishing/ with the same
      # owner/repo/workflow/environment values as the PyPI publisher.
      - name: Publish to TestPyPI (staging)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      # Publish to real PyPI only after TestPyPI succeeds.
      # Trusted Publisher registered at https://pypi.org/manage/account/publishing/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --title "$TAG" \
            --generate-notes
