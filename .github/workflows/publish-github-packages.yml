name: Publish to GitHub Releases

# Builds all 21 qx-* packages and attaches the wheels + sdists as assets
# to a GitHub Release, providing an installable distribution while PyPI
# rate limits are in effect.
#
# Install after the release is created:
#   pip install "qx-core @ https://github.com/Klauthed/qx-py/releases/download/v0.1.0/qx_core-0.1.0-py3-none-any.whl"
#
# Or directly from git (no release needed, always latest master):
#   pip install "qx-core @ git+https://github.com/Klauthed/qx-py.git#subdirectory=packages/qx-core"

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Creates a pre-release if the tag does not yet exist."
        required: false
        default: "v0.1.0"

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  publish:
    name: Build & attach wheels to GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAG="${INPUT_TAG#v}"
            echo "value=v${TAG}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=v0.1.0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install deps
        run: uv sync --frozen

      - name: Build all packages
        run: bash scripts/build.sh --clean

      - name: Create release if it doesn't exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            cat > /tmp/release-notes.md << 'NOTES'
          Pre-release distribution while PyPI uploads are rate-limited.

          Install any package:
            pip install "qx-core @ git+https://github.com/Klauthed/qx-py.git#subdirectory=packages/qx-core"

          Or after downloading a wheel asset:
            pip install qx_core-0.1.0-py3-none-any.whl
          NOTES
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Qx $TAG" \
              --notes-file /tmp/release-notes.md \
              --prerelease
            echo "Created release $TAG"
          else
            echo "Release $TAG already exists — uploading assets"
          fi

      - name: Upload wheels and sdists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            echo "→ $(basename "$f")"
            gh release upload "$TAG" "$f" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber \
              && echo "  ✓ uploaded" \
              || echo "  ⚠ skipped"
          done

      - name: Job summary
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          REPO="${{ github.repository }}"
          echo "## Wheels attached to release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Install a package (direct URL):**" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install \"qx-core @ https://github.com/${REPO}/releases/download/${TAG}/qx_core-0.1.0-py3-none-any.whl\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Install from git (no release needed):**" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install \"qx-core @ git+https://github.com/${REPO}.git#subdirectory=packages/qx-core\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Release page:** https://github.com/${REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
