name: Publish to GitHub Packages

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0). Leave blank to use latest tag."
        required: false

permissions:
  packages: write
  contents: read

jobs:
  publish:
    name: Build & publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Resolve ref
        id: ref
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            # Normalise: prepend v if missing (e.g. "0.1.0" → "v0.1.0")
            TAG="${INPUT_TAG#v}"
            echo "value=v${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.value }}

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install deps
        run: uv sync --frozen

      - name: Build all packages
        run: ./scripts/build.sh --clean

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            echo "→ $(basename "$f")"
            uvx twine upload \
              --repository-url "https://upload.pypi.pkg.github.com/${REPO_OWNER}/" \
              --skip-existing \
              "$f" \
              || echo "  ⚠ upload failed — continuing"
          done

      - name: Summary
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "## GitHub Packages published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install with pip:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "pip install qx-core --index-url https://pypi.pkg.github.com/${REPO_OWNER}/simple/" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install with uv — add to \`pyproject.toml\`:" >> "$GITHUB_STEP_SUMMARY"
          echo '```toml' >> "$GITHUB_STEP_SUMMARY"
          echo "[[tool.uv.index]]" >> "$GITHUB_STEP_SUMMARY"
          echo 'name = "klauthed"' >> "$GITHUB_STEP_SUMMARY"
          echo "url = \"https://pypi.pkg.github.com/${REPO_OWNER}/simple/\"" >> "$GITHUB_STEP_SUMMARY"
          echo "explicit = true" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
