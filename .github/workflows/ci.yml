name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

  # ── Type check ──────────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run mypy packages/*/src/ examples/*/src/

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      - name: pytest (packages)
        run: uv run pytest packages/ -q --tb=short

      - name: pytest (examples — unit/smoke)
        run: uv run pytest examples/ -q --tb=short --ignore=examples/identity-service/tests/integration

  # ── VS Code extension ───────────────────────────────────────────────────────
  vscode-ext:
    name: VS Code extension (compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extensions/vscode/package-lock.json
      - run: npm ci
      - run: npm run compile

  # ── Integration tests ───────────────────────────────────────────────────────
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - run: uv sync --frozen

      # testcontainers uses the Docker daemon that ships with ubuntu-latest.
      # Disabling Ryuk avoids a race between the reaper and the runner's
      # Docker daemon teardown at the end of the job.
      - name: pytest (integration — real Postgres via testcontainers)
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest examples/identity-service/tests/integration/ -q --tb=short
