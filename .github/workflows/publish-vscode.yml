name: Publish VS Code Extension

on:
  push:
    tags: ["vscode-v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. vscode-v0.1.0). Leave blank to use HEAD."
        required: false

jobs:
  publish:
    name: Build & publish to VS Code Marketplace
    runs-on: ubuntu-latest

    permissions:
      contents: write  # to attach .vsix to a GitHub release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        working-directory: extensions/vscode
        run: npm ci

      - name: Compile TypeScript
        working-directory: extensions/vscode
        run: npm run compile

      - name: Package .vsix
        working-directory: extensions/vscode
        run: npx vsce package

      - name: Publish to VS Code Marketplace
        working-directory: extensions/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --pat "$VSCE_PAT"

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "value=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Attach .vsix to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          gh release create "$TAG" extensions/vscode/*.vsix \
            --repo "$GITHUB_REPOSITORY" \
            --title "VS Code Extension $TAG" \
            --generate-notes \
            || gh release upload "$TAG" extensions/vscode/*.vsix \
                 --repo "$GITHUB_REPOSITORY" \
                 --clobber
